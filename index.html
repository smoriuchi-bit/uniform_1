<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AR着せ替え撮影 プロトタイプ</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #16191d;
    --accent: #5ec8a8;
    --text: #eef1f0;
    --muted: #8a9096;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100%;
    /* 100vhはスマホのアドレスバーの表示/非表示で実際の見た目とズレるため、
       JSで実測した高さ(--app-height)を優先して使う。
       未対応ブラウザ向けに100vh→100dvhの順でフォールバックも用意。 */
    height: 100vh;
    height: 100dvh;
    height: var(--app-height, 100dvh);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  video {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0; /* カメラ映像はcanvasに描画するので、videoタグ自体は非表示 */
    pointer-events: none;
  }
  canvas#overlay {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 100%;
    height: 100%;
    /* 映像の実際のピクセルサイズに関わらず、アスペクト比を保ったまま
       画面いっぱいに拡大縮小する(小さいサイズのまま表示されるのを防ぐ) */
    object-fit: contain;
    pointer-events: auto;
    cursor: pointer;
    touch-action: manipulation;
  }
  #topBar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
    pointer-events: none;
  }
  #topBar .item-name {
    font-size: 14px;
    color: var(--muted);
  }
  #topBar .item-name strong {
    color: var(--text);
    font-weight: 600;
  }
  #status {
    pointer-events: none;
    position: absolute;
    top: 54px; left: 16px;
    font-size: 12px;
    color: var(--muted);
    z-index: 10;
  }
  #controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 22px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    z-index: 10;
    background: linear-gradient(to top, rgba(0,0,0,.6), transparent);
    pointer-events: none;
  }
  #shutter {
    pointer-events: auto;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 4px solid var(--text);
    background: transparent;
    position: relative;
    cursor: pointer;
  }
  #shutter::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--text);
  }
  #shutter:active::after { background: var(--accent); }
  #picker {
    position: absolute;
    left: 50%;
    bottom: calc(132px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    width: min(96%, 460px);
    background: rgba(18,20,23,.94);
    border: 1px solid #3a3f44;
    border-radius: 16px;
    padding: 10px 10px 12px;
    z-index: 12;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  #picker.show {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  #picker .picker-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    margin: 0 4px 8px;
  }
  #picker .picker-head button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    padding: 2px 6px;
    cursor: pointer;
  }
  #picker .picker-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  #picker .picker-row button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 2px 6px;
    border-radius: 12px;
    border: 1px solid #3a3f44;
    background: rgba(255,255,255,.04);
    color: var(--text);
    font-size: 9.5px;
    line-height: 1.25;
    cursor: pointer;
  }
  #picker .picker-row button img {
    width: 100%;
    height: 64px;
    object-fit: cover;
    object-position: top center; /* 服の上半身(襟まわり)が見えるように切り出す */
    border-radius: 8px;
  }
  #picker .picker-row button.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  #topBar .item-name.hide {
    opacity: 0;
    transition: opacity .6s ease;
  }
  #preview {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.9);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 20;
  }
  #preview img {
    max-width: 90%;
    max-height: 70vh;
    border-radius: 8px;
  }
  #preview .actions { display: flex; gap: 12px; }
  #preview button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    cursor: pointer;
  }
  #preview .save { background: var(--accent); color: #05201a; font-weight: 600; }
  #preview .close { background: #333; color: var(--text); }
  #permissionNotice {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-size: 14px;
    color: var(--muted);
    z-index: 15;
  }
  #landscapeNotice {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-size: 16px;
    line-height: 1.6;
    color: var(--text);
    background: rgba(5, 6, 8, 0.97);
    z-index: 40;
  }
  #landscapeNotice.show {
    display: flex;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <div id="topBar">
    <div class="item-name" id="hint">人物の服をタップすると、その人だけ着せ替えできます</div>
  </div>
  <div id="status">姿勢推定を初期化中...</div>

  <!-- 人物の服をタップすると、その人の制服を選ぶパネルが開く -->
  <div id="picker" aria-hidden="true">
    <div class="picker-head">
      <span>この人の制服を選ぶ</span>
      <button id="pickerClose" aria-label="閉じる">✕</button>
    </div>
    <div class="picker-row" id="pickerRow"></div>
  </div>

  <div id="controls">
    <button id="shutter" aria-label="撮影"></button>
  </div>

  <div id="permissionNotice" style="display:none;">
    カメラへのアクセスを許可してください。<br />
    ※このデモはHTTPS環境(またはlocalhost)で動作します。file:// で直接開いた場合はカメラが動作しません。
  </div>
</div>

<div id="landscapeNotice">
  📱 スマホを縦向きにしてご利用ください
</div>

<div id="preview">
  <img id="previewImg" alt="撮影結果" />
  <div class="actions">
    <button class="save" id="saveBtn">保存する</button>
    <button class="close" id="closeBtn">閉じる</button>
  </div>
</div>

<!-- MediaPipe Tasks Vision (Pose Landmarker) -->
<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ---------------------------------------------------------
   1. 服アイテム定義
   QRコードには例えば
     https://your-domain.example/ar.html?item=seifuku_blazer
   のようなURLを埋め込む想定。
   type:"image" のアイテムは実際の服画像(透過PNG)を
   drawImage() で重ねる。type:"shape" は簡易シルエットの
   プレースホルダー(動作確認・デモ切り替え用)。
--------------------------------------------------------- */
const ITEMS = {
  // 実際の制服画像(透過PNG)を肩に固定して重ねるシンプル版。
  // anchor は画像内での「肩の位置」の基準値(単位は画像自体のpx):
  //   shoulderCenterX ... 両肩の中点のx座標
  //   shoulderY       ... 肩関節の高さ(y座標)
  //   shoulderWidth   ... 肩関節どうしの間隔(服の肩先〜肩先の約0.88倍)
  // widthMultiplier は、検出した肩幅に対して服を何倍の大きさで表示するか。
  // 服が小さすぎる/大きすぎる場合はこの値を、
  // 上下にズレる場合は shoulderY を調整する(大きくすると服が上へ、小さくすると下へ動く)。
  // QRコードのURLは ?item=キー名 で指定する(キー名は変えないこと)。
  seifuku_sailor: {
    label: "女子セーラー",
    type: "image",
    src: "uniform_f_sailor_v2.png",
    anchor: {
      imgWidth: 461,
      imgHeight: 980,
      shoulderCenterX: 227.5,
      shoulderY: 88.2,
      shoulderWidth: 312.2,
    },
    widthMultiplier: 1.1,
  },
  seifuku_blazer: {
    label: "女子ブレザー",
    type: "image",
    src: "uniform_f_blazer_v2.png",
    anchor: {
      imgWidth: 314,
      imgHeight: 667,
      shoulderCenterX: 154.7,
      shoulderY: 84.0,
      shoulderWidth: 219.8,
    },
    widthMultiplier: 1.1,
  },
  seifuku_polo_f: {
    label: "女子ポロシャツ",
    type: "image",
    src: "uniform_f_polo_v2.png",
    anchor: {
      imgWidth: 443,
      imgHeight: 819,
      shoulderCenterX: 217.6,
      shoulderY: 83.2,
      shoulderWidth: 252.8,
    },
    widthMultiplier: 1.1,
  },
  seifuku_polo: {
    label: "男子ポロシャツ",
    type: "image",
    src: "uniform_m_polo_v2.png",
    anchor: {
      imgWidth: 374,
      imgHeight: 1028,
      shoulderCenterX: 184.8,
      shoulderY: 82.6,
      shoulderWidth: 263.9,
    },
    widthMultiplier: 1.1,
  },
  seifuku_blazer_m: {
    label: "男子ブレザー",
    type: "image",
    src: "uniform_m_blazer_v2.png",
    anchor: {
      imgWidth: 349,
      imgHeight: 1084,
      shoulderCenterX: 172.2,
      shoulderY: 102.2,
      shoulderWidth: 272.3,
    },
    widthMultiplier: 1.1,
  },
};

// 制服画像は事前に読み込んでおく
const loadedImages = {};
Object.entries(ITEMS).forEach(([key, item]) => {
  const img = new Image();
  img.src = item.src;
  loadedImages[key] = img;
});

const params = new URLSearchParams(location.search);
// 新しく画面に写った人が最初に着る制服。QRコードのURL(?item=キー名)で指定できる。
// 指定がなければ女子ブレザー。人物をタップして個別に変更できる。
const defaultItemKey = params.get("item") && ITEMS[params.get("item")]
  ? params.get("item")
  : "seifuku_blazer";

/* ---------------------------------------------------------
   2. カメラ初期化
--------------------------------------------------------- */
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const statusEl = document.getElementById("status");
const permissionNotice = document.getElementById("permissionNotice");

// この端末・ブラウザでは、スマホを縦に持っていてもカメラ映像自体が
// 横長で送られてくることを実機で確認済み。回転はさせず、代わりに
// 画面の縦横比に合わせて映像の中央部分だけを切り出して表示する。
let cropParams = { srcX: 0, cropWidth: 0, rawH: 0 };

function updateCropParams() {
  const rawW = video.videoWidth;
  const rawH = video.videoHeight;
  if (!rawW || !rawH) return;

  // 画面(見えている範囲)の縦横比に合わせて、必要な横幅を逆算する
  const targetAspect = window.innerWidth / window.innerHeight; // 縦長なら1未満
  let cropWidth = Math.round(rawH * targetAspect);
  if (cropWidth > rawW) cropWidth = rawW; // 元映像より広くは切り出せない
  const srcX = Math.round((rawW - cropWidth) / 2);

  cropParams = { srcX, cropWidth, rawH };
  overlay.width = cropWidth;
  overlay.height = rawH;
}

async function setupCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1080 },
        height: { ideal: 1920 },
      },
      audio: false,
    });

    video.srcObject = stream;
    await video.play();

    updateCropParams();
    window.addEventListener("resize", updateCropParams);
    window.addEventListener("orientationchange", updateCropParams);
  } catch (err) {
    console.error(err);
    permissionNotice.style.display = "flex";
    statusEl.textContent = "カメラを起動できませんでした";
    throw err;
  }
}

/* ---------------------------------------------------------
   3. Pose Landmarker 初期化
--------------------------------------------------------- */
let poseLandmarker;

// 同時に検出・着せ替えする最大人数。
// 増やすほど処理が重くなる(スマホでは4人程度が目安)。
const MAX_PEOPLE = 4;

// 確認用の切り替え(URLに付けて使う)
//   ?debug=1      ... 画面左上に「検出◯人 / 採用◯人 / 表示◯人」を出す
//   ?pose=image   ... 毎フレーム独立に検出するモード(重いが、人の取りこぼしが減る場合がある)
const POSE_MODE = new URLSearchParams(location.search).get("pose") === "image" ? "IMAGE" : "VIDEO";
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU",
    },
    runningMode: POSE_MODE,
    numPoses: MAX_PEOPLE,
    // 既定値(0.5)だと2人目以降が検出から漏れやすいため、少し緩める。
    // 緩めた分の誤検出・二重検出は、描画側で除去している。
    minPoseDetectionConfidence: 0.3,
    minPosePresenceConfidence: 0.3,
    minTrackingConfidence: 0.3,
  });
}

/* ---------------------------------------------------------
   4. 服オーバーレイ描画
   人物ごとに「肩の中心・角度・肩幅」を計算し、その人が着ている
   制服の画像を、肩幅に合わせて拡大縮小・回転して重ねる。
--------------------------------------------------------- */
const MAX_TILT_RAD = 0.45; // 服の傾きの上限(約26°)。検出のブレで極端に傾くのを防ぐ

function getBodyGeometry(landmarks, w, h) {
  const ls = landmarks[11]; // 被写体本人から見た左肩
  const rs = landmarks[12]; // 被写体本人から見た右肩
  const lh = landmarks[23]; // 被写体本人から見た左腰
  const rh = landmarks[24]; // 被写体本人から見た右腰
  if (!ls || !rs || !lh || !rh) return null;

  const shoulder11 = { x: ls.x * w, y: ls.y * h };
  const shoulder12 = { x: rs.x * w, y: rs.y * h };

  // MediaPipeの11/12番は「被写体本人から見た」左右のため、カメラに正対していると
  // 画像上では逆(向かって右に本人の左肩)になる。左右は画像上のx座標で揃える。
  const imgLeft = shoulder11.x < shoulder12.x ? shoulder11 : shoulder12;
  const imgRight = shoulder11.x < shoulder12.x ? shoulder12 : shoulder11;

  const centerX = (imgLeft.x + imgRight.x) / 2;
  const centerY = (imgLeft.y + imgRight.y) / 2;
  const hipX = ((lh.x + rh.x) / 2) * w;
  const hipY = ((lh.y + rh.y) / 2) * h;

  // 服の傾き。
  // ・肩の線だけから決めると、肩の位置が少しずれただけで角度が大きく振れ、
  //   体より服の方が傾いて見える(小さく写る人ほど顕著)。
  // ・そこで、体の軸(肩の中心→腰の中心)の傾きを主に使い、肩の線は補助にする。
  //   服の縦方向(スカート・ズボンの向き)も、この軸に沿うのが自然。
  // ・腰がよく見えていない場合は、当てにならないので肩の線の影響を半分に弱める。
  const shoulderAngle = Math.atan2(imgRight.y - imgLeft.y, imgRight.x - imgLeft.x);
  const hipVis = Math.min(lh.visibility ?? 1, rh.visibility ?? 1);
  let torsoAngle = null;
  let angle;
  if (hipVis >= 0.5 && Math.hypot(hipX - centerX, hipY - centerY) > 1) {
    torsoAngle = Math.atan2(centerX - hipX, hipY - centerY); // 鉛直からの傾き(右に倒れる向きが正)
    angle = 0.25 * shoulderAngle + 0.75 * torsoAngle;
  } else {
    angle = 0.5 * shoulderAngle;
  }
  angle = Math.max(-MAX_TILT_RAD, Math.min(MAX_TILT_RAD, angle));

  return {
    centerX, centerY,
    shoulderWidthPx: Math.hypot(imgRight.x - imgLeft.x, imgRight.y - imgLeft.y),
    angle,
    hipX, hipY,
    // 以下は ?debug=1 の確認表示用
    lx: imgLeft.x, ly: imgLeft.y, rx: imgRight.x, ry: imgRight.y,
    shoulderAngle, torsoAngle,
  };
}

// ?debug=1 用: 検出された肩の線(黄)と体の軸(水色)、角度を重ねて表示する
function drawDebugSkeleton(ctxTarget, raw, drawnAngle) {
  const deg = (r) => `${Math.round((r * 180) / Math.PI)}°`;
  ctxTarget.save();
  ctxTarget.lineWidth = 4;
  ctxTarget.strokeStyle = "#ffd400";
  ctxTarget.beginPath(); ctxTarget.moveTo(raw.lx, raw.ly); ctxTarget.lineTo(raw.rx, raw.ry); ctxTarget.stroke();
  ctxTarget.strokeStyle = "#00e5ff";
  ctxTarget.beginPath(); ctxTarget.moveTo(raw.centerX, raw.centerY); ctxTarget.lineTo(raw.hipX, raw.hipY); ctxTarget.stroke();
  ctxTarget.fillStyle = "#ffffff";
  ctxTarget.strokeStyle = "#000000";
  ctxTarget.lineWidth = 3;
  ctxTarget.font = "bold 26px sans-serif";
  const text = `肩${deg(raw.shoulderAngle)} 胴${raw.torsoAngle == null ? "-" : deg(raw.torsoAngle)} 服${deg(drawnAngle)}`;
  ctxTarget.strokeText(text, raw.centerX - 90, raw.centerY - 24);
  ctxTarget.fillText(text, raw.centerX - 90, raw.centerY - 24);
  ctxTarget.restore();
}

// 1人分の服を描画する。タップ判定に使うため、描画位置の情報を返す。
// glow=true のときは、選択中の人だと分かるよう服の輪郭を光らせる。
function drawClothing(ctxTarget, geom, itemKey, glow, alpha = 1) {
  const item = ITEMS[itemKey];
  const img = loadedImages[itemKey];
  if (!item || !img || !img.complete || img.naturalWidth === 0) return null; // 読み込み待ち

  const a = item.anchor;
  const scale = (geom.shoulderWidthPx / a.shoulderWidth) * (item.widthMultiplier || 1.0);
  const drawW = a.imgWidth * scale;
  const drawH = a.imgHeight * scale;
  const offsetX = -a.shoulderCenterX * scale;
  const offsetY = -a.shoulderY * scale;

  ctxTarget.save();
  ctxTarget.globalAlpha = alpha;
  ctxTarget.translate(geom.centerX, geom.centerY);
  ctxTarget.rotate(geom.angle);
  if (glow) {
    ctxTarget.shadowColor = "rgba(94, 200, 168, 1)";
    ctxTarget.shadowBlur = 36;
    ctxTarget.drawImage(img, offsetX, offsetY, drawW, drawH);
  }
  ctxTarget.drawImage(img, offsetX, offsetY, drawW, drawH);
  ctxTarget.restore();

  return { scale, offsetX, offsetY, imgW: a.imgWidth, imgH: a.imgHeight };
}

/* ---------------------------------------------------------
   5a. 人物の追跡
   MediaPipeは「何人いるか」は返すが、フレームをまたいで同じ人かどうか
   (ID)は返さない。そこで、前フレームの肩の位置・大きさと近い人を
   「同じ人」とみなして番号(trackId)を引き継ぎ、人ごとに制服を記憶する。
--------------------------------------------------------- */
const TRACK_TTL_MS = 2500;   // 検出が途切れても、この時間内に戻れば同じ人として扱う
const HOLD_FULL_MS = 250;    // 検出が途切れても、この時間までは服をそのまま表示し続ける
const HOLD_FADE_MS = 800;    // この時間にかけて徐々に薄くして消す(人が去った時に残像が居座らないため)
const SMOOTH_K = 0.55;       // 位置の平滑化(大きいほど追従が速く、小さいほど滑らか)
const ANGLE_SMOOTH_K = 0.3;  // 傾きは細かいブレが目立つので、位置より強めに平滑化する
const MATCH_MAX_DIST = 1.6;  // 肩幅の何倍まで動いたら「別の人」とみなすか
let tracks = [];             // { id, cx, cy, size, lastSeen, itemKey }
let nextTrackId = 1;

function smoothGeom(prev, next) {
  if (!prev) return { ...next };
  const m = (a, b) => a + (b - a) * SMOOTH_K;
  return {
    centerX: m(prev.centerX, next.centerX),
    centerY: m(prev.centerY, next.centerY),
    shoulderWidthPx: m(prev.shoulderWidthPx, next.shoulderWidthPx),
    angle: prev.angle + (next.angle - prev.angle) * ANGLE_SMOOTH_K,
    hipX: m(prev.hipX, next.hipX),
    hipY: m(prev.hipY, next.hipY),
  };
}

function updateTracks(people, nowMs) {
  const pairs = [];
  people.forEach((p, pi) => {
    tracks.forEach((t, ti) => {
      const d = Math.hypot(p.cx - t.cx, p.cy - t.cy) / Math.max(p.size, t.size);
      if (d < MATCH_MAX_DIST) pairs.push({ pi, ti, d });
    });
  });
  pairs.sort((a, b) => a.d - b.d); // 近い組み合わせから順に確定する

  const usedP = new Set();
  const usedT = new Set();
  for (const { pi, ti } of pairs) {
    if (usedP.has(pi) || usedT.has(ti)) continue;
    usedP.add(pi);
    usedT.add(ti);
    const t = tracks[ti];
    const p = people[pi];
    t.cx = p.cx; t.cy = p.cy; t.size = p.size; t.lastSeen = nowMs;
    t.geom = smoothGeom(t.geom, p.geom);
    t.raw = p.geom; // 確認表示用(平滑化前の肩・腰の位置)
    p.track = t;
  }
  // 既存の人に対応しなかった検出は、新しく現れた人。最初はデフォルトの制服を着る。
  people.forEach((p, pi) => {
    if (usedP.has(pi)) return;
    const t = { id: nextTrackId++, cx: p.cx, cy: p.cy, size: p.size, lastSeen: nowMs,
                itemKey: defaultItemKey, geom: { ...p.geom } };
    tracks.push(t);
    p.track = t;
  });
  tracks = tracks.filter((t) => nowMs - t.lastSeen <= TRACK_TTL_MS);
}

/* ---------------------------------------------------------
   5b. 制服の選択パネルと、タップした人の判定
--------------------------------------------------------- */
const pickerEl = document.getElementById("picker");
const pickerRow = document.getElementById("pickerRow");
const hintEl = document.getElementById("hint");
let selectedTrackId = null;
let hitTargets = []; // 直前のフレームで描画した人ごとの情報(タップ判定用)

function buildPicker() {
  pickerRow.innerHTML = "";
  Object.entries(ITEMS).forEach(([key, item]) => {
    const btn = document.createElement("button");
    btn.dataset.key = key;
    const img = document.createElement("img");
    img.src = item.src;
    img.alt = "";
    const label = document.createElement("span");
    label.textContent = item.label;
    btn.append(img, label);
    btn.addEventListener("click", () => {
      const t = tracks.find((t) => t.id === selectedTrackId);
      if (t) t.itemKey = key; // 選ばれた人だけ着替える
      closePicker();
    });
    pickerRow.appendChild(btn);
  });
}

function openPicker(trackId) {
  selectedTrackId = trackId;
  const t = tracks.find((t) => t.id === trackId);
  pickerRow.querySelectorAll("button").forEach((b) => {
    b.classList.toggle("active", !!t && b.dataset.key === t.itemKey);
  });
  pickerEl.classList.add("show");
  pickerEl.setAttribute("aria-hidden", "false");
  hintEl.classList.add("hide");
}

function closePicker() {
  selectedTrackId = null;
  pickerEl.classList.remove("show");
  pickerEl.setAttribute("aria-hidden", "true");
}

document.getElementById("pickerClose").addEventListener("click", closePicker);
buildPicker();
setTimeout(() => hintEl.classList.add("hide"), 8000);

// 画面上のタップ位置 → Canvas内の座標(object-fit:contain の余白も考慮)
function clientToCanvas(clientX, clientY) {
  const r = overlay.getBoundingClientRect();
  const s = Math.min(r.width / overlay.width, r.height / overlay.height);
  const ox = r.left + (r.width - overlay.width * s) / 2;
  const oy = r.top + (r.height - overlay.height * s) / 2;
  return { x: (clientX - ox) / s, y: (clientY - oy) / s };
}

// 制服画像の「その位置の透明度」を調べる(透明な所=服ではない所は反応させない)
const alphaCache = {};
function alphaAt(itemKey, u, v) {
  let e = alphaCache[itemKey];
  if (!e) {
    const img = loadedImages[itemKey];
    if (!img || !img.complete || !img.naturalWidth) return 0;
    const c = document.createElement("canvas");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const cx = c.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    try {
      e = { w: c.width, h: c.height, data: cx.getImageData(0, 0, c.width, c.height).data };
    } catch (err) {
      e = { w: c.width, h: c.height, data: null };
    }
    alphaCache[itemKey] = e;
  }
  if (!e.data) return 255; // 読み取れない環境では、画像の矩形全体を当たり判定にする
  const iw = ITEMS[itemKey].anchor.imgWidth;
  const ih = ITEMS[itemKey].anchor.imgHeight;
  const x = Math.min(e.w - 1, Math.max(0, Math.floor((u * e.w) / iw)));
  const y = Math.min(e.h - 1, Math.max(0, Math.floor((v * e.h) / ih)));
  return e.data[(y * e.w + x) * 4 + 3];
}

// タップ位置にある人(のtrackId)を返す。なければnull。
function hitTest(px, py) {
  // 1) 服の上をタップ(手前の人=後から描いた人を優先)
  for (let i = hitTargets.length - 1; i >= 0; i--) {
    const t = hitTargets[i];
    const dx = px - t.geom.centerX;
    const dy = py - t.geom.centerY;
    const c = Math.cos(-t.geom.angle);
    const s = Math.sin(-t.geom.angle);
    const lx = dx * c - dy * s;
    const ly = dx * s + dy * c;
    const u = (lx - t.g.offsetX) / t.g.scale;
    const v = (ly - t.g.offsetY) / t.g.scale;
    if (u < 0 || v < 0 || u >= t.g.imgW || v >= t.g.imgH) continue;
    if (alphaAt(t.itemKey, u, v) > 30) return t.trackId;
  }
  // 2) 服の少し外側でも、体(肩〜腰)の近くなら反応させる(押しやすさのため)
  let best = null;
  let bestD = Infinity;
  for (const t of hitTargets) {
    const { centerX: ax, centerY: ay, hipX: bx, hipY: by, shoulderWidthPx } = t.geom;
    const vx = bx - ax, vy = by - ay;
    const len2 = vx * vx + vy * vy || 1;
    const k = Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / len2));
    const d = Math.hypot(px - (ax + vx * k), py - (ay + vy * k));
    if (d < shoulderWidthPx * 0.8 && d < bestD) { best = t.trackId; bestD = d; }
  }
  return best;
}

overlay.addEventListener("click", (ev) => {
  const p = clientToCanvas(ev.clientX, ev.clientY);
  const id = hitTest(p.x, p.y);
  if (id === null) {
    closePicker(); // 人のいない所をタップしたらパネルを閉じる
  } else {
    openPicker(id);
  }
});

/* ---------------------------------------------------------
   5. メインループ
   カメラ映像(横長)の中央部分を画面の縦横比に合わせて切り出して
   このCanvasに毎フレーム描画し、その上に人ごとの服を重ね描きする。
   回転は行わない。videoタグ自体は非表示(opacity:0)で、
   単なる映像ソースとしてのみ使う。
--------------------------------------------------------- */
let lastVideoTime = -1;
let lastCropSig = "";

function renderLoop() {
  if (video.readyState >= 2 && poseLandmarker) {
    const nowMs = performance.now();
    if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const result = POSE_MODE === "IMAGE"
        ? poseLandmarker.detect(video)
        : poseLandmarker.detectForVideo(video, nowMs);

      const cropSig = `${video.videoWidth}x${video.videoHeight}@${window.innerWidth}x${window.innerHeight}`;
      if (cropSig !== lastCropSig) {
        updateCropParams();
        lastCropSig = cropSig;
      }

      const rawW = video.videoWidth;
      const rawH = video.videoHeight;
      const { srcX, cropWidth } = cropParams;

      ctx.clearRect(0, 0, overlay.width, overlay.height);
      // 横長映像の中央部分だけを、そのままの向きで切り出して描画(回転なし)
      ctx.drawImage(video, srcX, 0, cropWidth, rawH, 0, 0, cropWidth, rawH);

      // 検出された全員分について、切り出し後のCanvas座標系に変換する。
      // ランドマークは「切り出す前の生の映像全体」基準の正規化座標なので、
      // x座標を切り出し範囲基準に直してから使う。
      const people = [];
      for (const lms of result.landmarks || []) {
        const remapped = lms.map((lm) => ({
          ...lm,
          x: (lm.x * rawW - srcX) / cropWidth,
        }));
        const ls = remapped[11];
        const rs = remapped[12];
        if (!ls || !rs) continue;

        // 肩がほとんど見えていない検出(ノイズ)は除外。
        // 厳しくしすぎると2人目が出たり消えたりするので、緩めにしている。
        const vis = ((ls.visibility ?? 1) + (rs.visibility ?? 1)) / 2;
        if ((ls.visibility ?? 1) < 0.15 || (rs.visibility ?? 1) < 0.15) continue;

        // 肩の中心が切り出し範囲の外(画面外)にいる人は描画しない
        const cx = (ls.x + rs.x) / 2;
        if (cx < -0.1 || cx > 1.1) continue;

        const geom = getBodyGeometry(remapped, cropWidth, rawH);
        if (!geom) continue;
        people.push({ geom, cx: geom.centerX, cy: geom.centerY, size: geom.shoulderWidthPx, vis });
      }
      const rawCount = people.length;

      // 検出を緩めた副作用で、1人が2つの姿勢として検出されることがあるため、
      // ほぼ同じ位置の検出は、肩の見えている度合いが高い方だけ残す。
      people.sort((a, b) => b.vis - a.vis);
      const uniquePeople = [];
      for (const p of people) {
        const dup = uniquePeople.some(
          (q) => Math.hypot(p.cx - q.cx, p.cy - q.cy) < 0.5 * Math.max(p.size, q.size)
        );
        if (!dup) uniquePeople.push(p);
      }
      people.length = 0;
      people.push(...uniquePeople);

      // 前フレームの人と対応づけて、人ごとの制服を引き継ぐ(人が0人でも期限切れの掃除をする)
      updateTracks(people, nowMs);
      if (selectedTrackId !== null && !tracks.some((t) => t.id === selectedTrackId)) {
        closePicker(); // 選択中の人が画面から消えた
      }

      // 描画対象 = 今フレームで検出された人 + 直前まで見えていたが今フレームだけ検出が
      // 途切れた人。後者は最後の位置で服を表示し続け、ちらつき(服が一瞬消える/入れ替わる)を防ぐ。
      const drawList = [];
      for (const t of tracks) {
        const gap = nowMs - t.lastSeen;
        if (gap > HOLD_FADE_MS || !t.geom) continue;
        const alpha = gap <= HOLD_FULL_MS ? 1 : 1 - (gap - HOLD_FULL_MS) / (HOLD_FADE_MS - HOLD_FULL_MS);
        drawList.push({ t, alpha });
      }

      // 奥(肩幅が小さい=遠い)の人から先に描き、手前の人の服が上に重なるようにする
      drawList.sort((a, b) => a.t.geom.shoulderWidthPx - b.t.geom.shoulderWidthPx);
      hitTargets = [];
      for (const { t, alpha } of drawList) {
        const g = drawClothing(ctx, t.geom, t.itemKey, t.id === selectedTrackId, alpha);
        if (g) hitTargets.push({ trackId: t.id, itemKey: t.itemKey, geom: t.geom, g });
        if (DEBUG && t.raw && alpha === 1) drawDebugSkeleton(ctx, t.raw, t.geom.angle);
      }

      if (DEBUG) {
        statusEl.textContent = `検出 ${rawCount}人 / 採用 ${people.length}人 / 表示 ${drawList.length}人`;
      } else {
        statusEl.textContent = drawList.length > 0 ? "" : "人物を検出中...";
      }
    }
  }
  requestAnimationFrame(renderLoop);
}

/* ---------------------------------------------------------
   6. 撮影処理
   overlay Canvasには毎フレーム「カメラ映像(中央クロップ済み)+服」が
   合成描画されているので、そのまま複製するだけでよい。
--------------------------------------------------------- */
const shutterBtn = document.getElementById("shutter");
const previewEl = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const saveBtn = document.getElementById("saveBtn");
const closeBtn = document.getElementById("closeBtn");

let lastCaptureBlob = null;

shutterBtn.addEventListener("click", async () => {
  // 選択中の光る輪郭が写り込まないよう、パネルを閉じて次の描画を待ってから撮影する
  closePicker();
  await new Promise((r) => setTimeout(r, 150));
  const captureCanvas = document.createElement("canvas");
  captureCanvas.width = overlay.width;
  captureCanvas.height = overlay.height;
  const cctx = captureCanvas.getContext("2d");

  cctx.drawImage(overlay, 0, 0);

  const dataUrl = captureCanvas.toDataURL("image/png");
  previewImg.src = dataUrl;
  previewEl.style.display = "flex";

  captureCanvas.toBlob((blob) => {
    lastCaptureBlob = blob;
  }, "image/png");
});

saveBtn.addEventListener("click", async () => {
  const filename = `ar-tryon-${Date.now()}.png`;

  // iOSのSafariは<a download>だけだとカメラロールに保存されないため、
  // 対応環境ではWeb Share API(共有シート経由の「画像を保存」)を優先する。
  if (lastCaptureBlob && navigator.canShare) {
    try {
      const file = new File([lastCaptureBlob], filename, { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (err) {
      // ユーザーが共有をキャンセルした場合等はここに来る。
      // その場合は下のダウンロード方式にフォールバックしない
      // (キャンセルしただけなのに別ダイアログが出ると煩わしいため)。
      if (err && err.name === "AbortError") return;
      console.warn("Web Share APIでの保存に失敗、ダウンロード方式にフォールバックします", err);
    }
  }

  // Web Share API非対応環境(主にPCブラウザ)向けのフォールバック
  const a = document.createElement("a");
  a.href = previewImg.src;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

closeBtn.addEventListener("click", () => {
  previewEl.style.display = "none";
});

/* ---------------------------------------------------------
   7. 実際の表示高さの反映
   スマホのブラウザは、アドレスバーやツールバーの表示/非表示によって
   実際に見える高さが変動する。CSSの100vhはこれを考慮しないため、
   実際に見えている高さを都度測ってCSS変数に反映することで、
   下端(スカート・シャッターボタン等)が画面外に隠れるのを防ぐ。
   window.visualViewport.height は、Safari下部ツールバー等の
   ブラウザUIを除いた「本当に見えている」高さを返すため、
   window.innerHeight より優先して使う。
--------------------------------------------------------- */
function updateAppHeight() {
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty("--app-height", `${h}px`);
}
updateAppHeight();
window.addEventListener("resize", updateAppHeight);
window.addEventListener("orientationchange", updateAppHeight);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", updateAppHeight);
  window.visualViewport.addEventListener("scroll", updateAppHeight);
}
// 初回描画直後は正しい値が取れないことがあるため、少し遅らせて再計測する
setTimeout(updateAppHeight, 300);

/* ---------------------------------------------------------
   8. 画面の向き
   このアプリは縦向き固定で使う。ブラウザの制約上、確実な縦向き固定は
   できない(特にiOS Safariは screen.orientation.lock 自体が未対応)ため:
   - Android Chrome等で使える場合はベストエフォートでロックを試みる
   - どのブラウザでも、横向きになったら警告を表示して気づかせる
   の二段構えにしている。
--------------------------------------------------------- */
const landscapeNotice = document.getElementById("landscapeNotice");

function updateOrientationNotice() {
  const isLandscape = window.matchMedia("(orientation: landscape)").matches;
  landscapeNotice.classList.toggle("show", isLandscape);
}
window.addEventListener("resize", updateOrientationNotice);
window.addEventListener("orientationchange", updateOrientationNotice);
updateOrientationNotice();

function tryLockPortrait() {
  if (screen.orientation && screen.orientation.lock) {
    // 対応ブラウザでも、フルスクリーンでない場合は失敗することが多いため
    // エラーは黙って無視する(横向き警告が保険として機能する)。
    screen.orientation.lock("portrait").catch(() => {});
  }
}

/* ---------------------------------------------------------
   9. 起動
--------------------------------------------------------- */
(async function init() {
  try {
    tryLockPortrait();
    await setupCamera();
    statusEl.textContent = "姿勢推定モデルを読み込み中...";
    await setupPose();
    statusEl.textContent = "";
    renderLoop();
  } catch (e) {
    console.error("初期化失敗:", e);
  }
})();
</script>
</body>
